    <g transform="translate(0, 74)">
      <circle cx="8" cy="10" r="8" fill="#fef3c7"/><text x="8" y="13" text-anchor="middle" fill="#92400e" font-size="8" font-family="system-ui">น</text>
      <text x="22" y="14" fill="#374151" font-family="system-ui" font-size="10">ครูนภา</text>
      <rect x="80" y="2" width="30" height="16" rx="4" fill="#fce7f3"/><rect x="114" y="2" width="30" height="16" rx="4" fill="#dcfce7"/>
      <rect x="148" y="2" width="30" height="16" rx="4" fill="#dbeafe"/><rect x="182" y="2" width="30" height="16" rx="4" fill="#dcfce7"/>
      <rect x="216" y="2" width="30" height="16" rx="4" fill="#fef3c7"/><rect x="250" y="2" width="30" height="16" rx="4" fill="#fce7f3"/>
      <rect x="284" y="2" width="30" height="16" rx="4" fill="#e0e7ff"/><rect x="318" y="2" width="30" height="16" rx="4" fill="#dcfce7"/>
