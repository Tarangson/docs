<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" fill="none">
  <defs>
    <!-- Gradient backgrounds -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="50%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="green1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="green2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="blue1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>

    <!-- Dot pattern -->
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#16a34a" opacity="0.08"/>
    </pattern>

    <!-- AI Circuit pattern -->
    <filter id="blur1">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#16a34a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bg)"/>
  <rect width="1200" height="500" fill="url(#dots)"/>

  <!-- Ambient glow orbs -->
  <circle cx="200" cy="100" r="150" fill="#22c55e" opacity="0.06" filter="url(#blur2)"/>
  <circle cx="900" cy="350" r="180" fill="#3b82f6" opacity="0.05" filter="url(#blur2)"/>
  <circle cx="600" cy="250" r="200" fill="#22c55e" opacity="0.04" filter="url(#blur2)"/>

  <!-- Left side: Timetable grid visualization -->
  <g transform="translate(60, 60)" filter="url(#shadow)">
    <!-- Grid card background -->
    <rect width="420" height="340" rx="16" fill="white" stroke="#e5e7eb" stroke-width="1"/>

    <!-- Grid header -->
    <rect width="420" height="48" rx="16" fill="url(#green1)"/>
    <rect y="32" width="420" height="16" fill="url(#green1)"/>
    <text x="20" y="32" fill="white" font-family="system-ui, sans-serif" font-size="15" font-weight="600">ตารางสอน ม.1/1 — เทอม 1/2569</text>

    <!-- Day labels -->
    <text x="20" y="78" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11">จ.</text>
    <text x="20" y="128" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11">อ.</text>
    <text x="20" y="178" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11">พ.</text>
    <text x="20" y="228" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11">พฤ.</text>
    <text x="20" y="278" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11">ศ.</text>

    <!-- Period labels -->
    <text x="60" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">1</text>
    <text x="110" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">2</text>
    <text x="160" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">3</text>
    <text x="210" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">4</text>
    <text x="260" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">5</text>
    <text x="310" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">6</text>
    <text x="360" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">7</text>
    <text x="400" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">8</text>

    <!-- Timetable cells - colorful blocks representing scheduled classes -->
    <!-- Monday -->
    <rect x="42" y="64" width="44" height="36" rx="6" fill="#dcfce7"/>
    <rect x="92" y="64" width="44" height="36" rx="6" fill="#dbeafe"/>
    <rect x="142" y="64" width="44" height="36" rx="6" fill="#dbeafe"/>
    <rect x="192" y="64" width="44" height="36" rx="6" fill="#fef3c7"/>
    <rect x="242" y="64" width="44" height="36" rx="6" fill="#fce7f3"/>
    <rect x="292" y="64" width="44" height="36" rx="6" fill="#dcfce7"/>
    <rect x="342" y="64" width="44" height="36" rx="6" fill="#e0e7ff"/>
    <rect x="382" y="64" width="30" height="36" rx="6" fill="#f3e8ff"/>

    <!-- Tuesday -->
    <rect x="42" y="114" width="44" height="36" rx="6" fill="#fef3c7"/>
    <rect x="92" y="114" width="44" height="36" rx="6" fill="#dcfce7"/>
    <rect x="142" y="114" width="44" height="36" rx="6" fill="#fce7f3"/>
    <rect x="192" y="114" width="44" height="36" rx="6" fill="#dbeafe"/>
    <rect x="242" y="114" width="44" height="36" rx="6" fill="#e0e7ff"/>
    <rect x="292" y="114" width="44" height="36" rx="6" fill="#fef3c7"/>
    <rect x="342" y="114" width="44" height="36" rx="6" fill="#dcfce7"/>
    <rect x="382" y="114" width="30" height="36" rx="6" fill="#dbeafe"/>

    <!-- Wednesday -->
    <rect x="42" y="164" width="44" height="36" rx="6" fill="#dbeafe"/>
    <rect x="92" y="164" width="44" height="36" rx="6" fill="#fce7f3"/>
    <rect x="142" y="164" width="44" height="36" rx="6" fill="#dcfce7"/>
    <rect x="192" y="164" width="44" height="36" rx="6" fill="#e0e7ff"/>
    <rect x="242" y="164" width="44" height="36" rx="6" fill="#fef3c7"/>
    <rect x="292" y="164" width="44" height="36" rx="6" fill="#dbeafe"/>
    <rect x="342" y="164" width="44" height="36" rx="6" fill="#fce7f3"/>
    <rect x="382" y="164" width="30" height="36" rx="6" fill="#dcfce7"/>

    <!-- Thursday -->
    <rect x="42" y="214" width="44" height="36" rx="6" fill="#e0e7ff"/>
    <rect x="92" y="214" width="44" height="36" rx="6" fill="#dcfce7"/>
    <rect x="142" y="214" width="44" height="36" rx="6" fill="#dbeafe"/>
    <rect x="192" y="214" width="44" height="36" rx="6" fill="#fce7f3"/>
    <rect x="242" y="214" width="44" height="36" rx="6" fill="#dcfce7"/>
    <rect x="292" y="214" width="44" height="36" rx="6" fill="#e0e7ff"/>
    <rect x="342" y="214" width="44" height="36" rx="6" fill="#fef3c7"/>
    <rect x="382" y="214" width="30" height="36" rx="6" fill="#dbeafe"/>

    <!-- Friday -->
    <rect x="42" y="264" width="44" height="36" rx="6" fill="#fce7f3"/>
    <rect x="92" y="264" width="44" height="36" rx="6" fill="#fef3c7"/>
    <rect x="142" y="264" width="44" height="36" rx="6" fill="#e0e7ff"/>
    <rect x="192" y="264" width="44" height="36" rx="6" fill="#dcfce7"/>
    <rect x="242" y="264" width="44" height="36" rx="6" fill="#dbeafe"/>
    <rect x="292" y="264" width="44" height="36" rx="6" fill="#fce7f3"/>
    <rect x="342" y="264" width="44" height="36" rx="6" fill="#dcfce7"/>
    <rect x="382" y="264" width="30" height="36" rx="6" fill="#e0e7ff"/>

    <!-- Check mark badge -->
    <circle cx="400" cy="320" r="16" fill="url(#green2)"/>
    <path d="M392 320 l5 5 l10-10" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Center: AI Brain / Neural network -->
  <g transform="translate(540, 120)">
    <!-- Central AI icon -->
    <circle cx="60" cy="130" r="55" fill="url(#green1)" opacity="0.1"/>
    <circle cx="60" cy="130" r="40" fill="url(#green1)" opacity="0.15"/>
    <circle cx="60" cy="130" r="28" fill="url(#green1)"/>

    <!-- AI sparkle icon inside -->
    <path d="M60 115 l3 10 l10 3 l-10 3 l-3 10 l-3-10 l-10-3 l10-3z" fill="white"/>
    <path d="M72 120 l2 5 l5 2 l-5 2 l-2 5 l-2-5 l-5-2 l5-2z" fill="white" opacity="0.7"/>

    <!-- Neural connection lines -->
    <!-- To grid (left) -->
    <line x1="5" y1="130" x2="-60" y2="100" stroke="#22c55e" stroke-width="1.5" opacity="0.3" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="0;-8" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="5" y1="130" x2="-60" y2="160" stroke="#22c55e" stroke-width="1.5" opacity="0.3" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="0;-8" dur="1.2s" repeatCount="indefinite"/>
    </line>

    <!-- To output (right) -->
    <line x1="115" y1="130" x2="180" y2="80" stroke="#3b82f6" stroke-width="1.5" opacity="0.3" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="0;-8" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="115" y1="130" x2="180" y2="180" stroke="#3b82f6" stroke-width="1.5" opacity="0.3" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="0;-8" dur="1.1s" repeatCount="indefinite"/>
    </line>

    <!-- Data nodes -->
    <circle cx="-60" cy="100" r="6" fill="#22c55e" opacity="0.5"/>
    <circle cx="-60" cy="160" r="6" fill="#22c55e" opacity="0.5"/>
    <circle cx="180" cy="80" r="6" fill="#3b82f6" opacity="0.5"/>
    <circle cx="180" cy="180" r="6" fill="#3b82f6" opacity="0.5"/>

    <!-- Floating particles -->
    <circle cx="20" cy="80" r="3" fill="#22c55e" opacity="0.4">
      <animate attributeName="cy" values="80;70;80" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="180" r="2.5" fill="#3b82f6" opacity="0.4">
      <animate attributeName="cy" values="180;170;180" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="200" r="2" fill="#16a34a" opacity="0.3">
      <animate attributeName="cy" values="200;190;200" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Right side: Output/Report card -->
  <g transform="translate(750, 80)" filter="url(#shadow)">
    <rect width="380" height="300" rx="16" fill="white" stroke="#e5e7eb" stroke-width="1"/>

    <!-- Header bar -->
    <rect width="380" height="44" rx="16" fill="url(#blue1)"/>
    <rect y="28" width="380" height="16" fill="url(#blue1)"/>
    <text x="20" y="28" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600">AI จัดให้เสร็จใน 3 วินาที</text>

    <!-- Stats row -->
    <g transform="translate(20, 60)">
      <!-- Stat 1 -->
      <rect width="105" height="60" rx="10" fill="#f0fdf4" stroke="#dcfce7"/>
      <text x="52" y="25" fill="#16a34a" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">450</text>
      <text x="52" y="42" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">คาบที่จัดได้</text>

      <!-- Stat 2 -->
      <g transform="translate(115, 0)">
        <rect width="105" height="60" rx="10" fill="#eff6ff" stroke="#dbeafe"/>
        <text x="52" y="25" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">0</text>
        <text x="52" y="42" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">ข้อขัดแย้ง</text>
      </g>

      <!-- Stat 3 -->
      <g transform="translate(230, 0)">
        <rect width="105" height="60" rx="10" fill="#fefce8" stroke="#fef3c7"/>
        <text x="52" y="25" fill="#ca8a04" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">98%</text>
        <text x="52" y="42" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">คะแนนคุณภาพ</text>
      </g>
    </g>

    <!-- Mini timetable preview -->
    <g transform="translate(20, 140)">
      <text x="0" y="12" fill="#374151" font-family="system-ui, sans-serif" font-size="11" font-weight="500">ผลตาราง ม.1/1</text>

      <!-- Mini grid rows -->
      <g transform="translate(0, 22)">
        <rect width="340" height="22" rx="4" fill="#f9fafb"/>
        <rect x="2" y="2" width="40" height="18" rx="3" fill="#dcfce7"/>
        <rect x="46" y="2" width="40" height="18" rx="3" fill="#dbeafe"/>
        <rect x="90" y="2" width="40" height="18" rx="3" fill="#fef3c7"/>
        <rect x="134" y="2" width="40" height="18" rx="3" fill="#fce7f3"/>
        <rect x="178" y="2" width="40" height="18" rx="3" fill="#e0e7ff"/>
        <rect x="222" y="2" width="40" height="18" rx="3" fill="#dcfce7"/>
        <rect x="266" y="2" width="40" height="18" rx="3" fill="#dbeafe"/>
        <rect x="310" y="2" width="28" height="18" rx="3" fill="#fef3c7"/>
      </g>
      <g transform="translate(0, 48)">
        <rect width="340" height="22" rx="4" fill="#f9fafb"/>
        <rect x="2" y="2" width="40" height="18" rx="3" fill="#dbeafe"/>
        <rect x="46" y="2" width="40" height="18" rx="3" fill="#fce7f3"/>
        <rect x="90" y="2" width="40" height="18" rx="3" fill="#dcfce7"/>
        <rect x="134" y="2" width="40" height="18" rx="3" fill="#e0e7ff"/>
        <rect x="178" y="2" width="40" height="18" rx="3" fill="#fef3c7"/>
        <rect x="222" y="2" width="40" height="18" rx="3" fill="#dbeafe"/>
        <rect x="266" y="2" width="40" height="18" rx="3" fill="#fce7f3"/>
        <rect x="310" y="2" width="28" height="18" rx="3" fill="#dcfce7"/>
      </g>
      <g transform="translate(0, 74)">
        <rect width="340" height="22" rx="4" fill="#f9fafb"/>
        <rect x="2" y="2" width="40" height="18" rx="3" fill="#fef3c7"/>
        <rect x="46" y="2" width="40" height="18" rx="3" fill="#dcfce7"/>
        <rect x="90" y="2" width="40" height="18" rx="3" fill="#dbeafe"/>
        <rect x="134" y="2" width="40" height="18" rx="3" fill="#dcfce7"/>
        <rect x="178" y="2" width="40" height="18" rx="3" fill="#fce7f3"/>
        <rect x="222" y="2" width="40" height="18" rx="3" fill="#e0e7ff"/>
        <rect x="266" y="2" width="40" height="18" rx="3" fill="#fef3c7"/>
        <rect x="310" y="2" width="28" height="18" rx="3" fill="#dbeafe"/>
      </g>
    </g>
  </g>

  <!-- Bottom tagline -->
  <text x="600" y="450" fill="#374151" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle" opacity="0.7">โปรแกรมจัดตารางสอน AI — เสร็จในไม่กี่นาที</text>
  <text x="600" y="475" fill="#6b7280" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" opacity="0.5">ลากวาง · ตรวจจับความขัดแย้ง · พิมพ์ลงกระดาษ</text>
</svg>
