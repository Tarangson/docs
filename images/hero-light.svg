    <rect x="50" y="45" width="430" height="52" fill="url(#greenBtn)"/>
    <text x="72" y="78" fill="white" font-family="'Chakra Petch', system-ui, sans-serif" font-size="16" font-weight="600" letter-spacing="0.5">ตารางสอน ม.1/1</text>
    <text x="420" y="76" fill="white" font-family="system-ui, sans-serif" font-size="11" opacity="0.7" text-anchor="end">เทอม 1/2569</text>

    <!-- Column headers (periods) -->
    <g font-family="system-ui, sans-serif" font-size="10" fill="#9ca3af" text-anchor="middle">
      <text x="120" y="112">คาบ 1</text><text x="170" y="112">คาบ 2</text>
      <text x="220" y="112">คาบ 3</text><text x="270" y="112">คาบ 4</text>
      <text x="330" y="112">คาบ 5</text><text x="380" y="112">คาบ 6</text>
      <text x="430" y="112">คาบ 7</text>
