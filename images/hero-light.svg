      <text x="57" y="50" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">คะแนนคุณภาพ</text>
      <text x="57" y="62" text-anchor="middle" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="9">ดีเยี่ยม</text>
