  <text x="840" y="393" text-anchor="middle" fill="white" font-family="'Chakra Petch', system-ui, sans-serif" font-size="13" font-weight="500">ใช้ผลลัพธ์นี้</text>

  <rect x="930" y="370" width="100" height="36" rx="10" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <text x="980" y="393" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="13">จัดใหม่</text>
