    <!-- Stat: คาบที่จัดได้ -->
    <rect width="115" height="70" rx="12" fill="#f0fdf4" stroke="#dcfce7" stroke-width="0.5"/>
    <text x="57" y="32" text-anchor="middle" fill="#16a34a" font-family="system-ui, sans-serif" font-size="26" font-weight="700">450</text>
    <text x="57" y="50" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">คาบที่จัดได้</text>
    <text x="57" y="62" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="9">450/450</text>

    <!-- Stat: ข้อขัดแย้ง -->
