    <animateMotion path="M490,230 C540,230 540,200 575,200" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#10b981" opacity="0.7">
    <animateMotion path="M490,230 C540,230 540,260 575,260" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#22c55e">
