    <path d="M451 393 l4.5 4.5 l8.5-8.5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== CENTER: Connection flow ===== -->
  <!-- Animated flow line -->
  <path d="M490 230 C540 230, 540 200, 575 200" stroke="url(#glowLine)" stroke-width="2" fill="none">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <path d="M490 230 C540 230, 540 260, 575 260" stroke="url(#glowLine)" stroke-width="2" fill="none">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <path d="M675 230 C710 230, 710 200, 730 200" stroke="url(#glowLine)" stroke-width="2" fill="none"/>
  <path d="M675 230 C710 230, 710 260, 730 260" stroke="url(#glowLine)" stroke-width="2" fill="none"/>

  <!-- Small floating dots on paths -->
