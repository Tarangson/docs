      <text x="57" y="50" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">ข้อขัดแย้ง</text>
      <circle cx="92" cy="14" r="8" fill="#22c55e"/>
      <path d="M88 14 l3 3 l5-5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
