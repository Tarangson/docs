    <text x="298" y="402" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="8">พัก</text>

    <!-- === Timetable cells === -->
    <!-- Monday -->
    <rect x="96" y="124" width="48" height="28" rx="6" fill="#dcfce7" stroke="#bbf7d0" stroke-width="0.5"/>
    <text x="120" y="142" text-anchor="middle" fill="#166534" font-family="system-ui" font-size="8" font-weight="500">คณิต</text>
    <rect x="148" y="124" width="48" height="28" rx="6" fill="#dbeafe" stroke="#bfdbfe" stroke-width="0.5"/>
    <text x="172" y="142" text-anchor="middle" fill="#1e40af" font-family="system-ui" font-size="8" font-weight="500">อังกฤษ</text>
    <rect x="200" y="124" width="48" height="28" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="0.5"/>
    <text x="224" y="142" text-anchor="middle" fill="#92400e" font-family="system-ui" font-size="8" font-weight="500">ไทย</text>
    <rect x="252" y="124" width="48" height="28" rx="6" fill="#fce7f3" stroke="#fbcfe8" stroke-width="0.5"/>
    <text x="276" y="142" text-anchor="middle" fill="#9d174d" font-family="system-ui" font-size="8" font-weight="500">ศิลปะ</text>
    <rect x="308" y="124" width="48" height="28" rx="6" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="0.5"/>
    <text x="332" y="142" text-anchor="middle" fill="#3730a3" font-family="system-ui" font-size="8" font-weight="500">วิทย์</text>
    <rect x="360" y="124" width="48" height="28" rx="6" fill="#dcfce7" stroke="#bbf7d0" stroke-width="0.5"/>
    <text x="384" y="142" text-anchor="middle" fill="#166534" font-family="system-ui" font-size="8" font-weight="500">สังคม</text>
    <rect x="412" y="124" width="48" height="28" rx="6" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="0.5"/>
    <text x="436" y="142" text-anchor="middle" fill="#6b21a8" font-family="system-ui" font-size="8" font-weight="500">พละ</text>

    <!-- Tuesday -->
    <rect x="96" y="174" width="48" height="28" rx="6" fill="#dbeafe" stroke="#bfdbfe" stroke-width="0.5"/>
    <rect x="148" y="174" width="48" height="28" rx="6" fill="#dcfce7" stroke="#bbf7d0" stroke-width="0.5"/>
    <rect x="200" y="174" width="48" height="28" rx="6" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="0.5"/>
    <rect x="252" y="174" width="48" height="28" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="0.5"/>
    <rect x="308" y="174" width="48" height="28" rx="6" fill="#fce7f3" stroke="#fbcfe8" stroke-width="0.5"/>
