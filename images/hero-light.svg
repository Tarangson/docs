    <rect x="412" y="174" width="48" height="28" rx="6" fill="#dcfce7" stroke="#bbf7d0" stroke-width="0.5"/>

    <!-- Wednesday -->
    <rect x="96" y="224" width="48" height="28" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="0.5"/>
    <rect x="148" y="224" width="48" height="28" rx="6" fill="#fce7f3" stroke="#fbcfe8" stroke-width="0.5"/>
    <rect x="200" y="224" width="48" height="28" rx="6" fill="#dcfce7" stroke="#bbf7d0" stroke-width="0.5"/>
    <rect x="252" y="224" width="48" height="28" rx="6" fill="#dbeafe" stroke="#bfdbfe" stroke-width="0.5"/>
    <rect x="308" y="224" width="48" height="28" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="0.5"/>
    <rect x="360" y="224" width="48" height="28" rx="6" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="0.5"/>
    <rect x="412" y="224" width="48" height="28" rx="6" fill="#fce7f3" stroke="#fbcfe8" stroke-width="0.5"/>

    <!-- Thursday -->
