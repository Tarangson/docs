      <rect x="148" y="2" width="30" height="16" rx="4" fill="#fef3c7"/><rect x="182" y="2" width="30" height="16" rx="4" fill="#e0e7ff"/>
      <rect x="216" y="2" width="30" height="16" rx="4" fill="#fce7f3"/><rect x="250" y="2" width="30" height="16" rx="4" fill="#dcfce7"/>
      <rect x="284" y="2" width="30" height="16" rx="4" fill="#dbeafe"/><rect x="318" y="2" width="30" height="16" rx="4" fill="#fef3c7"/>
      <text x="358" y="14" fill="#16a34a" font-family="system-ui" font-size="10" font-weight="600">8 คาบ</text>
